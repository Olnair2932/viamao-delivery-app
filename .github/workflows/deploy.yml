name: Deploy Firebase & Build APK

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Criar icones se faltarem
        run: |
          cd android/app/src/main/res
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p $d
            if [ ! -f $d/ic_launcher.png ]; then
              echo '[STRIPPED 96 bytes]' | base64 -d > $d/ic_launcher.png
            fi
            if [ ! -f $d/ic_launcher_round.png ]; then
              cp $d/ic_launcher.png $d/ic_launcher_round.png
            fi
          done
          cd ../../..

      - name: Criar Gradlew e Compilar
        run: |
          cd android
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copiar APK para site
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/app-debug.apk || true

      - name: Deploy no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCE_MASTER_629D1 }}'
          channelId: live
          projectId: finance-master-629d1
