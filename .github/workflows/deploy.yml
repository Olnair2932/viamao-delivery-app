name: Deploy Firebase & Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🚀 Deploy & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK e Gerar Gradlew
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copiar APK para site
        run: |
          mkdir -p public
          cp android/app/build/outputs/apk/debug/app-debug.apk public/viamao-delivery.apk

      - name: Deploy no Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project finance-master-629d1
        env:
          FIREBASE_TOKEN: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
