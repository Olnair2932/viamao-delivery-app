name: Deploy Firebase & Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy-firebase:
    name: 🌐 Deploy Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy para Firebase Hosting
        run: firebase deploy --only hosting --project finance-master-629d1 --token "${{ secrets.FIREBASE_TOKEN }}"

  build-android:
    name: 📱 Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Gerar APK Debug
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-viamao-delivery-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
