name: Migra PED 2
on: workflow_dispatch
jobs:
  migra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm i firebase-admin
      - name: Migra todos PED-
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node - << 'JS'
          const admin = require('firebase-admin');
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          admin.initializeApp({credential: admin.credential.cert(sa)});
          const db = admin.firestore();
          (async()=>{
            const snap = await db.collection('entregas').get();
            console.log('Total entregas', snap.size);
            let migrados=0;
            for(const doc of snap.docs){
              const id=doc.id;
              if(!id.startsWith('PED-179385')) continue;
              const d=doc.data();
              console.log('Achou', id, 'pago=', d.pago, 'status=', d.status, 'filial=', d.filial);
              const ref=db.collection('pedidos_privados').doc(id);
              const exists = await ref.get();
              if(exists.exists){ console.log('Já existe', id); continue; }
              await ref.set({
                id:id,
                filial:d.filial||'matriz',
                total:d.total||1,
                total_centavos:d.total_centavos||100,
                subtotal:d.subtotal||d.total||1,
                taxa:d.taxa||0,
                itens:d.itens||[{nome:'Teste MP', qtd:1, preco:1}],
                cliente:d.cliente||{nome:'João Teste MP'},
                tipo:d.tipo||'entrega',
                pago:true,
                status:'pago',
                forma_pagamento:' 【entity-Mercado Pago¦canonical_name=Mercado Pago】',
                createdAt:d.createdAt||Date.now(),
                pagoEm:Date.now(),
                pagamento_id:d.pagamento_id||'manual'
              },{merge:true});
              console.log('>>> MIGRADO', id);
              migrados++;
            }
            console.log('Fim, migrados', migrados);
          })();
          JS
