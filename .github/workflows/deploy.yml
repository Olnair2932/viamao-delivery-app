name: Deploy Firebase & Build APK

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Criar icones se faltarem
        run: |
          python3 - << 'PY'
          import os, struct, zlib
          def make_png(path, size):
              width = 1
              height = 1
              raw_data = b'\x00' + bytes([0, 128, 255, 255])
              def chunk(typ, data):
                  c = struct.pack('>I', len(data)) + typ + data
                  c += struct.pack('>I', zlib.crc32(typ + data) & 0xffffffff)
                  return c
              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
              png += chunk(b'IDAT', zlib.compress(raw_data))
              png += chunk(b'IEND', b'')
              open(path, 'wb').write(png)
          base = 'android/app/src/main/res'
          os.makedirs(base, exist_ok=True)
          for d in ['mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']:
              folder = os.path.join(base, d)
              os.makedirs(folder, exist_ok=True)
              for name in ['ic_launcher.png','ic_launcher_round.png']:
                  p = os.path.join(folder, name)
                  if not os.path.exists(p):
                      make_png(p, 48)
                      print(f'criado {p}')
          PY

      - name: Criar Gradlew e Compilar
        run: |
          cd android
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copiar APK para site
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/app-debug.apk || true

      - name: Deploy no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: finance-master-629d1
