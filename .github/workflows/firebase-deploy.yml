name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy do Hosting
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > /tmp/firebase-sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json firebase deploy --only hosting --project central-d7800 --non-interactive

      - name: Deploy das Regras do Firestore
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json firebase deploy --only firestore:rules --project central-d7800 --non-interactive
